# 生产环境（SPRING_PROFILES_ACTIVE=prod）。必须的环境变量见 docs/06-运维手册.md；
# 启动时 ProductionGuard 会检查密钥、Cookie、Redis、Mock 通道等，不满足拒绝启动。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:shitu}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${DB_SSL:true}&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus

server:
  # 在 Nginx / SLB 之后：Tomcat RemoteIpValve 只信任内网代理地址传来的 X-Forwarded-For / X-Forwarded-Proto
  forward-headers-strategy: native

shitu:
  dev:
    seed-demo: false
  sms:
    expose-code-in-mock: false
  kv:
    type: ${SHITU_KV_TYPE:redis}

logging:
  level:
    root: info
    com.shitu: info
  file:
    name: ${SHITU_LOG_DIR:/var/log/shitu}/shitu-server.log
  logback:
    rollingpolicy:
      max-file-size: 200MB
      max-history: 30
