# 预览环境：单机、单端口 8888、HTTP。四个前端按路径区分：
#   /        求职端 H5        /staff/  驻场端 H5
#   /admin/  公司后台         /ops/    运营中台
# 正式环境用 deploy/nginx/shitu.conf（各自域名 + HTTPS），不要用这一份。
upstream shitu_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 8888 default_server;
    server_name _;
    server_tokens off;

    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 接口与渠道短链
    location /api/ {
        proxy_pass http://shitu_api;
        include /etc/nginx/snippets/shitu-preview-proxy.conf;
    }
    location ^~ /r/ {
        proxy_pass http://shitu_api;
        include /etc/nginx/snippets/shitu-preview-proxy.conf;
    }
    location /actuator/ { return 404; }

    # 带 hash 的构建产物，长缓存
    location ~ ^/(staff/|admin/|ops/)?assets/ {
        root /srv/shitu;
        rewrite ^/assets/(.*)$ /seeker/assets/$1 break;
        rewrite ^/admin/assets/(.*)$ /console/assets/$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /staff { return 302 /staff/; }
    location = /admin { return 302 /admin/; }
    location = /ops   { return 302 /ops/; }

    location /staff/ {
        alias /srv/shitu/staff/;
        try_files $uri $uri/ /staff/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    location /admin/ {
        alias /srv/shitu/console/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    location /ops/ {
        alias /srv/shitu/ops/;
        try_files $uri $uri/ /ops/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    location / {
        root /srv/shitu/seeker;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
