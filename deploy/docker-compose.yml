# 本地依赖服务（可选）。本机已安装 MySQL 8 / Redis 时不需要启动。
# 用法：docker compose -f deploy/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: shitu_local
      MYSQL_DATABASE: shitu
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --log-bin-trust-function-creators=1   # 允许创建触发器（trg_user_source_immutable）
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shitu
      MINIO_ROOT_PASSWORD: shitu_local_minio
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  mysql-data:
  minio-data:
