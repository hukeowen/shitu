# /etc/nginx/snippets/shitu-common.conf：四个前端共用
# 注意：location 里一旦写了 add_header，就不再继承 server 级的 add_header，所以下面带 add_header 的 location 都重复写了安全头。
index index.html;
client_max_body_size 12m;            # 与后端 multipart 上限一致（营业执照、合同、花名册、工资表）

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;

# 接口：同源代理，refresh cookie（HttpOnly + Secure + SameSite）才能生效
location /api/ {
    proxy_pass http://shitu_api;
    include /etc/nginx/snippets/shitu-proxy.conf;
}

# 健康检查与指标不对外
location /actuator/ { return 404; }

# 构建产物带 hash，长缓存
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# SPA：其余路径回落到 index.html，且 index.html 不缓存（发版即时生效）
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
