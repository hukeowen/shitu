# 仕兔平台 Nginx 配置模板（四个前端各自域名 + 同源 /api 反向代理）
# 域名为示例：m.shitu.com（C 端 H5）/ staff.shitu.com（驻场 H5）/ admin.shitu.com（公司后台）/ ops.shitu.internal（平台中台，仅内网 + IP 白名单）
# 证书路径、后端地址按实际环境替换。前端静态文件为 pnpm build 产物（web/apps/<app>/dist）。

upstream shitu_api {
    server 10.0.0.11:8080 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP 一律跳 HTTPS
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------- C 端 H5
server {
    listen 443 ssl;
    http2 on;
    server_name m.shitu.com;
    ssl_certificate     /etc/nginx/certs/shitu.com.pem;
    ssl_certificate_key /etc/nginx/certs/shitu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/shitu/seeker;
    include /etc/nginx/snippets/shitu-common.conf;

    # 渠道码短链 /r/{code} → 后端记录访问并 302 到 H5（只匹配 /r/ 前缀，避免吃掉 /reports 等前端路由）
    location ^~ /r/ {
        proxy_pass http://shitu_api;
        include /etc/nginx/snippets/shitu-proxy.conf;
    }
}

# --------------------------------------------------------------------- 驻场 H5
server {
    listen 443 ssl;
    http2 on;
    server_name staff.shitu.com;
    ssl_certificate     /etc/nginx/certs/shitu.com.pem;
    ssl_certificate_key /etc/nginx/certs/shitu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/shitu/staff;
    include /etc/nginx/snippets/shitu-common.conf;
}

# --------------------------------------------------------------------- 公司后台
server {
    listen 443 ssl;
    http2 on;
    server_name admin.shitu.com;
    ssl_certificate     /etc/nginx/certs/shitu.com.pem;
    ssl_certificate_key /etc/nginx/certs/shitu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/shitu/console;
    include /etc/nginx/snippets/shitu-common.conf;
}

# --------------------------------------------------------------------- 平台中台（内网域名 + IP 白名单，docs/02 §3）
server {
    listen 443 ssl;
    http2 on;
    server_name ops.shitu.internal;
    ssl_certificate     /etc/nginx/certs/ops.pem;
    ssl_certificate_key /etc/nginx/certs/ops.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 10.0.0.0/8;          # 办公网 / VPN 出口，按实际替换
    deny all;

    root /srv/shitu/ops;
    include /etc/nginx/snippets/shitu-common.conf;
}
